encoding_model: cl100k_base
skip_workflows: []

models:
  default_chat_model:
    api_key: ${OPENAI_API_KEY}
    type: openai_chat
    model: gpt-4o-mini
    model_supports_json: true
    max_tokens: 4000
    request_timeout: 180.0
    concurrent_requests: 5

  default_embedding_model:
    api_key: ${OPENAI_API_KEY}
    type: openai_embedding
    model: text-embedding-3-small

# Chunking - smaller chunks for message-based stories
chunks:
  size: 800
  overlap: 100

# Entity extraction with custom prompt and expanded entity types
extract_graph:
  model_id: default_chat_model
  prompt: "prompts/extract_graph.txt"
  entity_types: [PERSON, LOCATION, EVENT, OBJECT, TIME]
  max_gleanings: 2  # Extra passes to catch missed entities

# Description summarization with custom prompt
summarize_descriptions:
  model_id: default_chat_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

# Community reports with custom prompts
community_reports:
  model_id: default_chat_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

# Clustering settings
cluster_graph:
  max_cluster_size: 10

# Output settings
output:
  type: file
  base_dir: "output"

cache:
  type: file
  base_dir: "cache"

# Text embedding settings
embed_text:
  model_id: default_embedding_model
